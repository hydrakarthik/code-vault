{% extends "base.html" %}
{% block title %}Sign in - CloudVault{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card">
    <h1>Sign in</h1>
    {% if message %}
    <div class="status info" role="status">{{ message }}</div>
    {% endif %}
    {% if error %}
    <div class="status error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ get_csrf_token() }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <p class="auth-alt"><a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
